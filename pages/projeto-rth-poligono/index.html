<!DOCTYPE html>
<!-- RTH Análise de Polígono — página de detalhe do projeto -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RTH Análise de Polígono — ferramenta de sensoriamento remoto por Luciano (RithonDev)." />
    <link rel="shortcut icon" href="/icons/tridente.ico" type="image/x-icon">
    <title>RTH Análise de Polígono — RithonDev</title>
    <!-- home/home.css carrega nav, hero, social-bar, projetos e global (reset, cores, fontes) -->
    <link rel="stylesheet" href="/pages/home/home.css">
    <!-- projeto.css: estilos exclusivos desta página — container-projeto e back-link -->
    <link rel="stylesheet" href="/pages/projeto.css">
</head>
<body>

  <!-- Navegação principal — 3 colunas: marca · links · idioma -->
  <nav class="nav-principal" role="navigation" aria-label="Navegação principal">
    <a href="/" class="nav-brand">RTH</a>
    <ul>
      <!-- aria-current="page" em Projetos porque esta página é subpágina da seção Projetos -->
      <li><a href="/" data-key="nav-sobre">Sobre</a></li>
      <li><a href="/pages/projetos/" aria-current="page" data-key="nav-projetos">Projetos</a></li>
      <li><a href="/pages/rth-project/" data-key="nav-rth">RTH Project</a></li>
      <li><a href="/pages/catalogo/" data-key="nav-catalogo">Catálogo de Culturas</a></li>
      <li><a href="/pages/rth-explorer/" data-key="nav-explorer">RTH World Explorer</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="lang-item">
      <span class="lang-label" data-key="lang-label">Idioma</span>
      <!-- data-active="pt" indica o idioma padrão; langHandler.js atualiza ao trocar -->
      <button class="lang-toggle" data-active="pt" aria-label="Switch to English">
        <span class="opt-en">EN</span> | <span class="opt-pt">PT</span>
      </button>
    </div>
  </nav>

  <main>
    <section class="painel-home">

      <!-- Container do projeto — borda HUD, alinhado à esquerda para leitura de artigo -->
      <div class="container-projeto">

        <!-- Link de retorno para a lista completa de projetos -->
        <a href="/pages/projetos/" class="back-link" data-key="back-projetos">← Projetos</a>

        <h1 class="title-container">
          <!-- data-key="proj-2-title" vinculado ao texto em langHandler.js para EN/PT -->
          <span class="title" data-key="proj-2-title">RTH Análise de Polígono</span>
        </h1>

        <!-- Área de conteúdo — substituir coming-soon pelo conteúdo real do projeto -->
        <div class="projeto-content">
          <p class="text-pad" style="text-align: center;"><span data-key="link-projeto">Link do Projeto:</span> <a href="https://luciano-ufsc.projects.earthengine.app/view/rthseries" target="_blank" rel="noopener noreferrer" class="destaque" data-key="acesse-aqui">Acesse aqui</a></p>
          <p class="text-pad" data-key="proj-2-detail">Adicione o polígono desejado para análise e intervalo de tempo. <span class="destaque">Resultará em 3 thumbnails clicáveis para melhor análise</span></p>
          <img src="/img/projeto-analisePoligono.png" alt="Interface da ferramenta RTH Análise de Polígono com thumbnails em 3 composições de bandas">
        </div>

      </div>
    </section>
  </main>

  <!-- aria-hidden="true": vídeo decorativo, sem informação para leitores de tela -->
  <div id="video-background" aria-hidden="true">
    <video src="/img/background.mp4" autoplay loop muted playsinline poster="/img/background.jpg" class="videoback"></video>
  </div>

  <!-- type="module" permite usar import/export no JS; global.js inicializa langHandler -->
  <script type="module" src="/js/global.js"></script>
</body>
</html>
